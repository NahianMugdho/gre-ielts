\/div>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th><strong>একটি সৎ কথা<\/strong> কোনো বই পড়েই Band 8 বা GRE স্কোর নিশ্চিত হয় না। বই আপনাকে সঠিক উপাদান ও পদ্ধতি দেবে, ফলাফল আসবে নিয়মিত অভ্যাস থেকে। প্রতিদিন নিজে লিখলে, জোরে বললে এবং ভুল শুধরালে এই বই আপনার প্রস্তুতির মূল ভিত্তি হয়ে উঠবে।<\/div>\n"}, {"part": "শুরু", "title": "বইয়ের কাঠামো", "id": "p1", "kind": "doc", "html": "<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th><strong>অংশ<\/strong><\/th>\n<th><strong>বিষয়<\/strong><\/th>\n<th><strong>কী পাবেন<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Part A<\/td>\n<td>GRE Vocabulary<\/td>\n<td>Barron's ৩৩৩ শব্দ, ২১টি অর্থভিত্তিক গ্রুপ, প্রতিটি শব্দের বাংলা অর্থ ও উদাহরণ, Roots টেবিল, Practice Set<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Part B<\/td>\n<td>IELTS Vocabulary<\/td>\n<td>২২টি টপিক ইউনিট (৩৩০ শব্দ), প্রতিটির বাংলা গল্প<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Part C<\/td>\n<td>IELTS Skills Toolkit<\/td>\n<td>Writing Task 1 ও 2, Speaking, Listening, Reading, Grammar, Spelling<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Part D<\/td>\n<td>Revision<\/td>\n<td>কুইজ ও উত্তর, ৫০ দিনের প্ল্যান, সম্পূর্ণ Word Index<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n"}, {"part": "শুরু", "title": "কীভাবে পড়বেন", "id": "p2", "kind": "doc", "html": "<ul>\n<li><p><strong>প্রথমে শব্দ, তারপর গল্প:<\/strong> ইউনিটের তালিকা ও উদাহরণ বাক্য পড়ুন, পরে গল্পে লাল শব্দের অর্থ ঢেকে মনে করার চেষ্টা করুন।<\/p><\/li>\n<li><p><strong>লিখে শিখুন:<\/strong> প্রতিটি নতুন শব্দ দিয়ে নিজের একটি বাক্য খাতায় লিখুন। এটাই সবচেয়ে কার্যকর ধাপ।<\/p><\/li>\n<li><p><strong>Spaced Revision:<\/strong> শেখার ১ দিন, ৩ দিন, ৭ দিন, ১৪ দিন ও ৩০ দিন পর আবার দেখুন। প্রতিবার ৫ মিনিটই যথেষ্ট।<\/p><\/li>\n<li><p><strong>ভুল শব্দের আলাদা তালিকা:<\/strong> যে শব্দে বারবার ভুল হয়, সেগুলো একটা ছোট খাতায় তুলে রাখুন এবং প্রতিদিন চোখ বোলান।<\/p><\/li>\n<li><p><strong>জোরে বলুন:<\/strong> প্রতিদিন ৫টি শব্দ দিয়ে ৩০ সেকেন্ড করে কথা বলুন। Speaking-এর জড়তা এভাবেই কাটে।<\/p><\/li>\n<li><p><strong>GRE ও IELTS আলাদা রাখুন:<\/strong> GRE শব্দ আরও কঠিন ও সাহিত্যিক; IELTS-এর শব্দ বেশি ব্যবহারিক। দুটো একই দিনে শিখলে প্রথমে IELTS, পরে GRE পড়ুন।<\/p><\/li>\n<\/ul>\n<div class=\"callout\"><strong>দৈনিক সময়ের হিসাব (প্রতিদিন ২ ঘণ্টা)<\/strong> <strong>২০ মিনিট<\/strong> আজকের ইউনিট বা গ্রুপ পড়া · <strong>২০ মিনিট<\/strong> লিখে অনুশীলন · <strong>২০ মিনিট<\/strong> Speaking · <strong>৩০ মিনিট<\/strong> Reading/Listening · <strong>৩০ মিনিট<\/strong> পুরোনো শব্দের Revision ও ভুল শুধরানো।<\/div>\n"}, {"part": "Part A", "title": "Part A · GRE Vocabulary", "id": "p3", "kind": "doc", "html": "<p>GRE-তে ভোকাবুলারি দুইভাবে আসে: Text Completion/Sentence Equivalence-এ শব্দ চেনা, আর Reading-এ লেখকের সুর বোঝা। Barron's-এর ৩৩৩টি হাই-ফ্রিকোয়েন্সি শব্দ এখানে ২১টি অর্থভিত্তিক গ্রুপে সাজানো হয়েছে। এক গ্রুপের শব্দগুলোর ভাব কাছাকাছি, তাই একসাথে শিখলে মনে রাখা সহজ হয়।<\/p>\n<h3 id=\"gre-শব্দ-শেখার-৪টি-ধাপ\"><strong>GRE শব্দ শেখার ৪টি ধাপ<\/strong><\/h3>\n<ul>\n<li><p><strong>১. টিপ পড়ুন:<\/strong> প্রতিটি গ্রুপের শুরুতে লেখা বাক্যটি মূল ভাব ধরিয়ে দেবে।<\/p><\/li>\n<li><p><strong>২. শব্দ + অর্থ + উদাহরণ:<\/strong> একসাথে পড়ুন; উদাহরণ বাক্য জোরে বলুন।<\/p><\/li>\n<li><p><strong>৩. সমার্থক মিলান:<\/strong> একই গ্রুপের শব্দগুলোর মধ্যে সূক্ষ্ম পার্থক্য বুঝুন (যেমন Abate বনাম Assuage)।<\/p><\/li>\n<li><p><strong>৪. Practice Set:<\/strong> প্রতিটি গ্রুপের শেষে প্রশ্ন সমাধান করে বইয়ের শেষের উত্তর মিলান।<\/p><\/li>\n<\/ul>\n<div class=\"callout\"><strong>সতর্কতা: কিছু শব্দের একাধিক অর্থ<\/strong> <strong>Disinterested<\/strong> মানে নিরপেক্ষ, কিন্তু <strong>Uninterested<\/strong> মানে আগ্রহহীন। <strong>Resolve<\/strong> (দৃঢ়সংকল্প / সমাধান করা) আর <strong>Resolution<\/strong> (সংকল্প / প্রস্তাব) প্রসঙ্গ দেখে বুঝতে হবে। <strong>Strut<\/strong> দুই অর্থে আছে: দম্ভভরে হাঁটা (verb) ও সহায়ক কাঠামো (noun)। <strong>Flag, Log, Document, Default<\/strong> এসব সাধারণ শব্দের GRE অর্থ আলাদা, তাই তালিকা মন দিয়ে দেখুন।<\/div>\n"}, {"part": "Part A", "title": "Word Roots · মূল অংশ জানলে অচেনা শব্দও চেনা যায়", "id": "p4", "kind": "doc", "html": "<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th><strong>Root / Prefix<\/strong><\/th>\n<th><strong>অর্থ<\/strong><\/th>\n<th><strong>উদাহরণ<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td><strong>bene-, bon-<\/strong><\/td>\n<td>ভালো<\/td>\n<td>beneficent, benevolent<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>mal-, male-<\/strong><\/td>\n<td>খারাপ<\/td>\n<td>malingerer, malicious<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>dis-, di-<\/strong><\/td>\n<td>আলাদা / বিপরীত<\/td>\n<td>disparate, diverge, dissemble<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>con-, com-<\/strong><\/td>\n<td>একসাথে<\/td>\n<td>converge, compendium, commensurate<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>in-, im-, un-<\/strong><\/td>\n<td>না / বিপরীত<\/td>\n<td>inconsequential, immutable, unfettered<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>ob-, op-<\/strong><\/td>\n<td>বিরুদ্ধে<\/td>\n<td>obdurate, obviate, opprobrium<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>pre-, fore-<\/strong><\/td>\n<td>আগে<\/td>\n<td>precursor, precipitate, forestall<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>sub-, sup-<\/strong><\/td>\n<td>নিচে<\/td>\n<td>subside, supersede<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>ex-, e-<\/strong><\/td>\n<td>বাইরে<\/td>\n<td>exculpate, elicit, efflux<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>loqu-, locu-<\/strong><\/td>\n<td>কথা বলা<\/td>\n<td>loquacious, grandiloquent, eloquent<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>dict-<\/strong><\/td>\n<td>বলা<\/td>\n<td>diatribe, edict, predict<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>ver-<\/strong><\/td>\n<td>সত্য<\/td>\n<td>veracious, verify, aver<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>mend-, mal-<\/strong><\/td>\n<td>মিথ্যা / ত্রুটি<\/td>\n<td>mendacious, mendacity<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>fid-<\/strong><\/td>\n<td>বিশ্বাস<\/td>\n<td>perfidious, fidelity, diffidence<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>chron-<\/strong><\/td>\n<td>সময়<\/td>\n<td>anachronism, chronic<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>phil-<\/strong><\/td>\n<td>ভালোবাসা<\/td>\n<td>philanthropist, bibliophile<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>misc-, mix-<\/strong><\/td>\n<td>মেশানো<\/td>\n<td>amalgamate, miscellaneous<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>port-<\/strong><\/td>\n<td>বহন করা<\/td>\n<td>deport, import, portable<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>quies-<\/strong><\/td>\n<td>বিশ্রাম / শান্ত<\/td>\n<td>quiescent, acquiesce<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>somn-<\/strong><\/td>\n<td>ঘুম<\/td>\n<td>soporific, insomnia<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>luc-, lum-<\/strong><\/td>\n<td>আলো<\/td>\n<td>lucid, luminous, translucent<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>path-<\/strong><\/td>\n<td>অনুভূতি / রোগ<\/td>\n<td>apathy, antipathy, pathological<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td><strong>bell-, belli-<\/strong><\/td>\n<td>যুদ্ধ<\/td>\n<td>belligerent, rebellion<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><strong>cred-<\/strong><\/td>\n<td>বিশ্বাস করা<\/td>\n<td>discredit, credible, credulous<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>মনে রাখুন: Roots শুধু অনুমানে সাহায্য করে। অর্থ নিশ্চিত করতে সবসময় উদাহরণ বাক্য দেখুন।<\/p>\n"}, {"part": "Part A", "title": "G১ · শান্ত করা ও উপশম", "id": "g1", "kind": "set", "n": "1", "sub": "Soothe & Relieve", "tip": "মনে রাখার টিপ এই গ্রুপের প্রায় সব শব্দের মূল ভাব \"কমানো বা শান্ত করা\"। উত্তরে \"কমানো/শান্ত করা\" টাইপ বিকল্প থাকলে এই গ্রুপটাই মাথায় আনুন।", "q": [{"t": "The storm began to a______ by midnight.", "a": "abate"}, {"t": "The manager tried to a______ the angry customers.", "a": "appease"}, {"t": "The mayor p_______ protesters with a promise of talks.", "a": "placated"}]}, {"part": "Part A", "title": "G২ · নির্লিপ্ত, শান্ত ও অলস", "id": "g2", "kind": "set", "n": "2", "sub": "Calm, In haviour"}]}, {"part": "Part B", "title": "22. Business & Advertising ব্যবসা ও বিজ্ঞাপন", "id": "u22", "kind": "set", "n": "22", "sub": "", "tip": "", "story": "বাজারে <span class=\"t\" data-m=\"ভোক্তা\"><b>Consumer<\/b><\/span>র <span class=\"t\" data-m=\"চাহিদা\"><b>Demand<\/b><\/span> ও <span class=\"t\" data-m=\"সরবরাহ\"><b>Supply<\/b><\/span> দামের ওপর প্রভাব ফেলে। একটি <span class=\"t\" data-m=\"নতুন উদ্যোগ\"><b>Startup<\/b><\/span> সফল হতে হলে শক্ত <span class=\"t\" data-m=\"ব্র্যান্ড\"><b>Brand<\/b><\/span> দরকার, তাই <span class=\"t\" data-m=\"বিপণন\"><b>Marketing<\/b><\/span> ও <span class=\"t\" data-m=\"বিজ্ঞাপন\"><b>Advertisement<\/b><\/span> গুরুত্বপূর্ণ—সঠিক <span class=\"t\" data-m=\"লক্ষ্য গ্রাহক\"><b>Target audience<\/b><\/span> বেছে নিতে হয়। <span class=\"t\" data-m=\"খুচরা\"><b>Retail<\/b><\/span> বিক্রেতা ভালো <span class=\"t\" data-m=\"সরবরাহকারী\"><b>Supplier<\/b><\/span> খোঁজে এবং <span class=\"t\" data-m=\"গ্রাহকের আনুগত্য\"><b>Customer loyalty<\/b><\/span> ধরে রাখতে চেষ্টা করে, কারণ <span class=\"t\" data-m=\"মুনাফা\"><b>Profit<\/b><\/span> সেখান থেকেই আসে। কখনও <span class=\"t\" data-m=\"একীভূতকরণ\"><b>Merger<\/b><\/span> হয়, কখনও <span class=\"t\" data-m=\"একচেটিয়া\"><b>Monopoly<\/b><\/span> বাজার তৈরি হয়, আর ব্যর্থ হলে কেউ <span class=\"t\" data-m=\"দেউলিয়া\"><b>Bankrupt<\/b><\/span> হয়ে যান।", "q": [{"t": "A trusted b______ sells more.", "a": "brand"}, {"t": "The firm made a huge p______.", "a": "profit"}, {"t": "The s_______ delivered late.", "a": "supplier"}, {"t": "A m_______ can raise prices unfairly.", "a": "monopoly"}]}, {"part": "Part C", "title": "Part C · IELTS Skills Toolkit", "id": "p49", "kind": "doc", "html": "<p>শব্দভান্ডার তখনই কাজে লাগে যখন আপনি পরীক্ষার কাঠামো ও কৌশল জানেন। এই অংশে চারটি স্কিলের জন্য সংক্ষিপ্ত অথচ কার্যকর গাইড দেওয়া হলো।<\/p>\n"}, {"part": "Part C", "title": "IELTS Academic এক নজরে", "id": "p50", "kind": "doc", "html": "<div class=\"callout\"><strong>মডিউল<\/strong><\/th>\n<th><strong>সময়<\/strong><\/th>\n<th><strong>মূল বিষয়<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Listening<\/td>\n<td>৩০ মিনিট + ১০ মিনিট স্থানান্তর<\/td>\n<td>৪ সেকশন, ৪০ প্রশ্ন; অডিও একবারই বাজে<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Reading<\/td>\n<td>৬০ মিনিট<\/td>\n<td>৩টি প্যাসেজ, ৪০ প্রশ্ন; উত্তর সরাসরি Answer Sheet-এ লিখতে হয়<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Writing<\/td>\n<td>৬০ মিনিট<\/td>\n<td>Task 1 (গ্রাফ/চার্ট/প্রসেস/ম্যাপ, কমপক্ষে ১৫০ শব্দ), Task 2 (প্রবন্ধ, কমপক্ষে ২৫০ শব্দ)। Task 2-এর নম্বর বেশি<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Speaking<\/td>\n<td>১১–১৪ মিনিট<\/td>\n<td>Part 1 (পরিচিত বিষয়), Part 2 (১–২ মিনিটের বক্তৃতা), Part 3 (গভীর আলোচনা)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Writing ও Speaking-এ চারটি মানদণ্ডে সমান নম্বর (২৫% করে) দেওয়া হয়:<\/p>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th><strong>মানদণ্ড<\/strong><\/th>\n<th><strong>Writing<\/strong><\/th>\n<th><strong>Speaking<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>১<\/td>\n<td>Task Response / Task Achievement<\/td>\n<td>Fluency and Coherence<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>২<\/td>\n<td>Coherence and Cohesion<\/td>\n<td>Lexical Resource (শব্দভান্ডার)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>৩<\/td>\n<td>Lexical Resource (শব্দভান্ডার)<\/td>\n<td>Grammatical Range and Accuracy<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>৪<\/td>\n<td>Grammatical Range and Accuracy<\/td>\n<td>Pronunciation<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th><strong>এর মানে কী?<\/strong> শব্দভান্ডারের মাত্র ২৫% নম্বর। বাকি ৭৫% আসে গঠন, ব্যাকরণ, ধারাবাহিকতা এবং প্রশ্নের সঠিক উত্তর থেকে। তাই কঠিন শব্দ ঢোকানোর চেয়ে ভুলহীন, স্পষ্ট ও প্রাসঙ্গিক বাক্য লেখা বেশি লাভজনক।<\/div>\n"}, {"part": "Part C", "title": "Writing Task 1 · গ্রাফ, চার্ট, প্রসেস ও ম্যাপ", "id": "p51", "kind": "doc", "html": "<p>আপনার কাজ হলো তথ্য <strong>বর্ণনা<\/strong> করা, ব্যাখ্যা বা মতামত দেওয়া নয়। সময় রাখুন ২০ মিনিট, শব্দসংখ্যা ১৫০–১৮০।<\/p>\n<h3 id=\"৪-অনুচ্ছেদের-কাঠামো\"><strong>৪ অনুচ্ছেদের কাঠামো<\/strong><\/h3>\n<div class=\"callout\"><strong>অনুচ্ছেদ<\/strong><\/th>\n<th><strong>কী লিখবেন<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>১. Introduction<\/td>\n<td>প্রশ্নের বাক্য <strong>paraphrase<\/strong> করুন। কোনো সংখ্যা নয়।<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>২. Overview<\/td>\n<td>সবচেয়ে গুরুত্বপূর্ণ ২–৩টি প্রবণতা বা তুলনা। এটি না থাকলে Band ৬-এর ওপরে ওঠা কঠিন।<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>৩. Body 1<\/td>\n<td>প্রথম গ্রুপের বিস্তারিত তথ্য ও সংখ্যা।<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>৪. Body 2<\/td>\n<td>দ্বিতীয় গ্রুপের বিস্তারিত তথ্য ও তুলনা।<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"paraphrase-এর-সূত্র\"><strong>Paraphrase-এর সূত্র<\/strong><\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th><strong>প্রশ্নে যা থাকে<\/strong><\/th>\n<th><strong>আপনি যা লিখবেন<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>The graph shows<\/td>\n<td>The line graph illustrates / The chart compares<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>the number of<\/td>\n<td>the figures for / the quantity of<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>between 2000 and 2020<\/td>\n<td>over a twenty-year period / from 2000 to 2020<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>in three countries<\/td>\n<td>in three different nations<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>percentage<\/td>\n<td>proportion / share<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"প্রবণতার-ভাষা\"><strong>প্রবণতার ভাষা<\/strong><\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th><strong>দিক<\/strong><\/th>\n<th><strong>Verb<\/strong><\/th>\n<th><strong>Noun<\/strong><\/th>\n<th><strong>Adverb<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>বৃদ্ধি<\/td>\n<td>rise, grow, increase, climb, surge<\/td>\n<td>a rise, a growth, an upward trend<\/td>\n<td>sharply, steadily, gradually<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>হ্রাস<\/td>\n<td>fall, drop, decline, decrease, plunge<\/td>\n<td>a fall, a decline, a downturn<\/td>\n<td>slightly, dramatically, considerably<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>অপরিবর্তিত<\/td>\n<td>remain stable, level off, stay constant<\/td>\n<td>a plateau<\/td>\n<td>steadily<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>ওঠানামা<\/td>\n<td>fluctuate, oscillate<\/td>\n<td>a fluctuation<\/td>\n<td>erratically<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>শীর্ষ / তলানি<\/td>\n<td>peak at, reach a high of / bottom out at<\/td>\n<td>a peak, a low point<\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th><strong>পরিমাণের শব্দ<\/strong><\/th>\n<th><strong>ব্যবহার<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>approximately, roughly, around<\/td>\n<td>আনুমানিক সংখ্যা বোঝাতে: <strong>approximately<\/strong> 40 per cent<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>just under / just over<\/td>\n<td>সামান্য কম/বেশি: <strong>just under<\/strong> half<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>a quarter, a third, a majority, a minority<\/td>\n<td>ভগ্নাংশ বোঝাতে: <strong>a third<\/strong> of respondents<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>twice as high as, three times higher than<\/td>\n<td>গুণগত তুলনা: Sales were <strong>twice as high as<\/strong> costs<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"নমুনা-band-7-ধরনের--line-graph\"><strong>নমুনা (Band 7+ ধরনের) — Line Graph<\/strong><\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th><strong>প্রশ্ন (কাল্পনিক তথ্য)<\/strong> The graph shows the number of online shoppers in three countries between 2010 and 2020.<\/div>\n<p>The line graph compares the number of people who shopped online in three countries over a ten-year period.<\/p>\n<p>Overall, online shopping rose in every country, although the increase was most dramatic in Country A. Country C remained the lowest throughout.<\/p>\n<p>In 2010, Country A had approximately 10 million online shoppers, while Country B had 15 million. Country A then grew steadily and overtook Country B in 2015, before surging to 60 million by 2020. Country B, by contrast, increased gradually to reach 40 million at the end of the period.<\/p>\n<p>Country C started from only 5 million and fluctuated slightly between 2012 and 2016. It then rose to 20 million in 2020, which was still the smallest figure of the three.<\/p>\n<div class=\"callout\"><strong>কেন এটি ভালো?<\/strong> Introduction-এ প্রশ্ন paraphrase করা হয়েছে, Overview আলাদা অনুচ্ছেদে আছে। Body-তে সংখ্যা ও তুলনা (overtook, by contrast) আছে। বিভিন্ন verb ও adverb ব্যবহার হয়েছে: grew steadily, surging, fluctuated slightly।<\/div>\n<h3 id=\"process-ও-map-এর-জন্য-দ্রুত-নোট\"><strong>Process ও Map-এর জন্য দ্রুত নোট<\/strong><\/h3>\n<ul>\n<li><p><strong>Process:<\/strong> ধাপ অনুযায়ী লিখুন। ব্যবহার করুন: First, Next, Subsequently, Then, After that, Finally। বেশির ভাগ বাক্য <strong>Passive Voice<\/strong>-এ (The wood is cut, then it is dried)।<\/p><\/li>\n<li><p><strong>Map:<\/strong> আগে-পরে তুলনা করুন। ব্যবহার করুন: was replaced by, was converted into, was demolished, was constructed, to the north/south of, adjacent to, in the north-eastern corner।<\/p><\/li>\n<li><p><strong>Table/Bar chart:<\/strong> সবচেয়ে বড়, সবচেয়ে ছোট ও উল্লেখযোগ্য পার্থক্য বেছে নিন; সব সংখ্যা লিখবেন না।<\/p><\/li>\n<\/ul>\n"}, {"part": "Part C", "title": "Writing Task 2 · প্রবন্ধ", "id": "p52", "kind": "doc", "html": "<p>সময় রাখুন ৪০ মিনিট: ৫ মিনিট পরিকল্পনা, ৩০ মিনিট লেখা, ৫ মিনিট ভুল খোঁজা। শব্দসংখ্যা ২৫০–২৮০।<\/p>\n<h3 id=\"পাঁচ-ধরনের-প্রশ্ন-এবং-কীভাবে-উত্তর-দেবেন\"><strong>পাঁচ ধরনের প্রশ্ন এবং কীভাবে উত্তর দেবেন<\/strong><\/h3>\n<div class=\"callout\"><strong>ধরন<\/strong><\/th>\n<th><strong>চেনার উপায়<\/strong><\/th>\n<th><strong>উত্তরের কাঠামো<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Opinion<\/td>\n<td>\"To what extent do you agree or disagree?\"<\/td>\n<td>Intro (মত) → Body 1 (প্রধান কারণ) → Body 2 (দ্বিতীয় কারণ) → Conclusion<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Discussion<\/td>\n<td>\"Discuss both views and give your opinion.\"<\/td>\n<td>Intro → Body 1 (View A) → Body 2 (View B) → Conclusion (নিজের মত)<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Problem–Solution<\/td>\n<td>\"What are the causes? What can be done?\"<\/td>\n<td>Intro → Body 1 (Problems/Causes) → Body 2 (Solutions) → Conclusion<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Advantages–Disadvantages<\/td>\n<td>\"Do the advantages outweigh the disadvantages?\"<\/td>\n<td>Intro (মত) → Body 1 (Advantages) → Body 2 (Disadvantages) → Conclusion<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Two-part question<\/td>\n<td>দুটি আলাদা প্রশ্ন থাকে<\/td>\n<td>Intro → Body 1 (প্রশ্ন ১) → Body 2 (প্রশ্ন ২) → Conclusion<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"একটি-ভালো-body-paragraph-peel\"><strong>একটি ভালো Body Paragraph (PEEL)<\/strong><\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th><strong>অংশ<\/strong><\/th>\n<th><strong>কাজ<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>P · Point<\/td>\n<td>অনুচ্ছেদের মূল বক্তব্য এক বাক্যে বলুন।<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>E · Explain<\/td>\n<td>কেন তা সত্য, দুই বাক্যে ব্যাখ্যা করুন।<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>E · Example<\/td>\n<td>একটি নির্দিষ্ট উদাহরণ দিন (দেশ, গবেষণা, বাস্তব ঘটনা)।<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>L · Link<\/td>\n<td>প্রশ্নের সঙ্গে সংযোগ ঘটিয়ে শেষ করুন।<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"টেমপ্লেট-নিজের-ভাষায়-বদলে-ব্যবহার-করুন\"><strong>টেমপ্লেট (নিজের ভাষায় বদলে ব্যবহার করুন)<\/strong><\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th><strong>অংশ<\/strong><\/th>\n<th><strong>নমুনা বাক্য<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Intro<\/td>\n<td>It is often argued that ___. This essay will discuss ___ and argue that ___.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Intro (Discussion)<\/td>\n<td>While some people believe ___, others maintain that ___. In my view, ___.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Body 1<\/td>\n<td>The primary reason for ___ is that ___. For instance, ___. As a result, ___.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Body 2<\/td>\n<td>Another significant factor is ___. A case in point is ___. This demonstrates that ___.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Conclusion<\/td>\n<td>In conclusion, although ___, I firmly believe that ___. Therefore, ___.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td><\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"সম্পূর্ণ-নমুনা-প্রবন্ধ-band-7-ধরনের\"><strong>সম্পূর্ণ নমুনা প্রবন্ধ (Band 7+ ধরনের)<\/strong><\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th><strong>প্রশ্ন<\/strong> More and more people are working from home. Do the advantages of this development outweigh the disadvantages?<\/div>\n<p>In recent years, remote work has become increasingly common thanks to faster internet and cloud technology. Although this trend creates some social and management challenges, I believe its benefits are greater.<\/p>\n<p>The most obvious advantage is the saving of time and money. Employees who work from home avoid long commutes, which reduces transport costs and stress. In a congested city such as Dhaka, workers can spend three hours a day in traffic, so staying at home effectively gives them back a significant part of their day. Employers also benefit because they can rent smaller offices and hire talented people regardless of their location.<\/p>\n<p>Another benefit is a better work–life balance. Parents can supervise their children, and people with disabilities can find jobs that were previously inaccessible. Studies have shown that flexible workers are often more productive because they can choose the hours in which they concentrate best.<\/p>\n<p>However, there are drawbacks. Working alone may lead to isolation, and ideas spread less easily without informal conversations in the office. In addition, some employees find it hard to separate work from private life, which can cause burnout. These problems, nevertheless, can be reduced through regular video meetings and clear working hours.<\/p>\n<p>In conclusion, while remote work has certain disadvantages, the savings, flexibility and wider job opportunities it offers outweigh them, especially if companies manage communication carefully.<\/p>\n<p>শব্দসংখ্যা: প্রায় ২৬০। দেখুন কীভাবে Intro-তে মত স্পষ্ট করা হয়েছে, প্রতিটি Body-তে Point + Example আছে এবং Conclusion-এ নতুন তথ্য নেই।<\/p>\n<h3 id=\"আইডিয়া-ব্যাংক--১২টি-জনপ্রিয়-টপিক\"><strong>আইডিয়া ব্যাংক · ১২টি জনপ্রিয় টপিক<\/strong><\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th><strong>টপিক<\/strong><\/th>\n<th><strong>পক্ষের যুক্তি<\/strong><\/th>\n<th><strong>বিপক্ষের যুক্তি<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Technology<\/td>\n<td>সময় বাঁচে, তথ্য সহজলভ্য, চিকিৎসায় উন্নতি<\/td>\n<td>নির্ভরশীলতা, গোপনীয়তা নষ্ট, কর্মসংস্থান হ্রাস<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Education<\/td>\n<td>দক্ষতা বাড়ে, আয় বাড়ে, বৈষম্য কমে<\/td>\n<td>খরচ বেশি, মুখস্থ নির্ভরতা, চাপ<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Environment<\/td>\n<td>বিশ্ব নিরাপদ থাকে, স্বাস্থ্য ভালো হয়<\/td>\n<td>শিল্পের খরচ বাড়ে, গরিব দেশের সামর্থ্যের সীমা<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Health<\/td>\n<td>প্রতিরোধমূলক সেবা খরচ কমায়<\/td>\n<td>সরকারি ব্যয়বহুল, সেবার মান অসম<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Crime<\/td>\n<td>কঠোর শাস্তি প্রতিরোধ করে<\/td>\n<td>পুনর্বাসন বেশি কার্যকর, দারিদ্র্যই মূল কারণ<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Government<\/td>\n<td>সরকার সমন্বয় ও নিরাপত্তা দেয়<\/td>\n<td>ব্যক্তিগত স্বাধীনতা সংকুচিত হয়<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Work<\/td>\n<td>নমনীয় কাজে উৎপাদনশীলতা বাড়ে<\/td>\n<td>একাকীত্ব, কাজ ও জীবনের সীমারেখা ঝাপসা<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Transport<\/td>\n<td>গণপরিবহন দূষণ ও জ্যাম কমায়<\/td>\n<td>প্রাথমিক বিনিয়োগ ব্যয়বহুল<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Media<\/td>\n<td>সচেতনতা ও গণতন্ত্র শক্তিশালী হয়<\/td>\n<td>ভুল তথ্য, পক্ষপাত, আসক্তি<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Globalisation<\/td>\n<td>বাণিজ্য ও কর্মসংস্থান বাড়ে<\/td>\n<td>স্থানীয় সংস্কৃতি ও ছোট ব্যবসা ক্ষতিগ্রস্ত<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Family<\/td>\n<td>সন্তানের নৈতিক শিক্ষা ঘরেই শুরু<\/td>\n<td>কর্মজীবী বাবা-মায়ের সময়ের অভাব<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Tourism<\/td>\n<td>আয় ও কাজ তৈরি করে<\/td>\n<td>পরিবেশ ও স্থানীয় জীবনে চাপ<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"linking-words--যোগসূত্রের-শব্দ\"><strong>Linking Words · যোগসূত্রের শব্দ<\/strong><\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th><strong>কাজ<\/strong><\/th>\n<th><strong>শব্দ / বাক্যাংশ<\/strong><\/th>\n<th><strong>ব্যবহার<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>যোগ করা<\/td>\n<td>In addition, Moreover, Furthermore, Besides<\/td>\n<td>Moreover, costs are lower.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>বৈপরীত্য<\/td>\n<td>However, Nevertheless, On the other hand, In contrast<\/td>\n<td>However, some disagree.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>ছাড় দেওয়া<\/td>\n<td>Although, While, Despite, In spite of<\/td>\n<td>Despite the cost, many agree.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>কারণ<\/td>\n<td>because, since, due to, owing to, as a result of<\/td>\n<td>Due to heavy traffic, ...<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>ফল<\/td>\n<td>Therefore, Consequently, As a result, Thus<\/td>\n<td>As a result, prices rose.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>উদাহরণ<\/td>\n<td>For example, For instance, such as, A case in point is<\/td>\n<td>For instance, Japan ...<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>ক্রম<\/td>\n<td>Firstly, Secondly, Finally, Subsequently<\/td>\n<td>Firstly, ...<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>সারাংশ<\/td>\n<td>In conclusion, To sum up, Overall<\/td>\n<td>Overall, benefits dominate.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n"}, {"part": "Part C", "title": "Speaking · তিন ধাপের কৌশল", "id": "p53", "kind": "doc", "html": "<p>Speaking-এ পরীক্ষক আপনার জ্ঞান নয়, <strong>কথা বলার ক্ষমতা<\/strong> যাচাই করেন। তাই সত্য বলুন, গল্প বানাতে হলে বানান, কিন্তু থামবেন না।<\/p>\n<div class=\"callout\"><strong>ধাপ<\/strong><\/th>\n<th><strong>সময়<\/strong><\/th>\n<th><strong>কৌশল<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Part 1<\/td>\n<td>৪–৫ মিনিট<\/td>\n<td>পরিচিত বিষয় (home, study, food, hobbies)। <strong>২–৩ বাক্যে<\/strong> উত্তর দিন: উত্তর + কারণ + ছোট উদাহরণ।<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Part 2<\/td>\n<td>১ মিনিট প্রস্তুতি + ১–২ মিনিট বক্তব্য<\/td>\n<td>Cue card-এর ৪টি পয়েন্ট ধরে বলুন। প্রস্তুতির সময় শব্দ নয়, <strong>কিওয়ার্ড<\/strong> লিখুন।<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Part 3<\/td>\n<td>৪–৫ মিনিট<\/td>\n<td>বিমূর্ত আলোচনা। কাঠামো: মত → কারণ → উদাহরণ → তুলনা/ভবিষ্যৎ।<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"part-1--নমুনা\"><strong>Part 1 · নমুনা<\/strong><\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th><strong>প্রশ্ন<\/strong><\/th>\n<th><strong>ভালো উত্তর<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>Do you enjoy cooking?<\/td>\n<td>Yes, quite a lot. It helps me relax after a busy day, and my mother taught me a few traditional recipes, so I love trying them out on weekends.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>What do you do in your free time?<\/td>\n<td>I usually read novels or go for a walk near my home. Recently I have also started learning guitar, which is harder than I expected, but it is fun.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Is your hometown a good place to live?<\/td>\n<td>Overall, yes. It is quieter than Dhaka and the air is cleaner, although job opportunities are limited, so many young people leave.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"part-2--নমুনা-উত্তর-প্রায়-২-মিনিট\"><strong>Part 2 · নমুনা উত্তর (প্রায় ২ মিনিট)<\/strong><\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th><strong>Cue Card<\/strong> Describe a teacher who has influenced you. You should say: who the teacher was, what subject he or she taught, what he or she was like, and explain why this person influenced you.<\/div>\n<p>I would like to talk about my physics teacher in high school, Mr Rahman. He taught us for two years, and he was one of those teachers who make a difficult subject feel simple.<\/p>\n<p>He was patient and very well organised. Instead of making us memorise formulas, he used everyday examples, such as how a ceiling fan or a bicycle works. I still remember how he once brought a small battery and a bulb to class so that we could see a circuit with our own eyes.<\/p>\n<p>He influenced me in two ways. First, he taught me that understanding is more important than memorising, which I still apply when I study. Second, he encouraged me to keep going when I failed a test, saying that mistakes are just information. Thanks to him, I later chose to study engineering. To be honest, I am not sure I would have made that decision without his support.<\/p>\n<div class=\"callout\"><strong>কেন কাজ করে<\/strong> ক্রমানুযায়ী: পরিচয় → বৈশিষ্ট্য → ঘটনা → প্রভাব। স্বাভাবিক ফিলার: \"To be honest\", \"I still remember\", \"To be specific\"। বিস্তারিত গল্প (battery and bulb) পরীক্ষককে মুগ্ধ করে।<\/div>\n<h3 id=\"part-3--area-কৌশল\"><strong>Part 3 · AREA কৌশল<\/strong><\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th><strong>ধাপ<\/strong><\/th>\n<th><strong>কাজ<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>A · Answer<\/td>\n<td>সরাসরি উত্তর দিন: \"I think it largely depends on...\"<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>R · Reason<\/td>\n<td>কারণ বলুন: \"...because...\"<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>E · Example<\/td>\n<td>বাস্তব উদাহরণ: \"For instance, in Bangladesh...\"<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>A · Alternative<\/td>\n<td>ভিন্ন দৃষ্টিকোণ: \"That said, some people might argue...\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"ফিলার-ও-বিরতি-কাটানোর-বাক্য\"><strong>ফিলার ও বিরতি কাটানোর বাক্য<\/strong><\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th><strong>চিন্তার সময় দরকার হলে<\/strong><\/th>\n<th><strong>বিষয় বদলাতে বা ব্যাখ্যা করতে<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>That's an interesting question...<\/td>\n<td>What I mean is...<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Let me think about that for a moment...<\/td>\n<td>To put it another way...<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Well, to be honest...<\/td>\n<td>As far as I am concerned...<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>I haven't really thought about that before, but...<\/td>\n<td>Speaking of which...<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"অভিধানে-নেই-পরীক্ষায়-আছে--কিছু-কাজের-idiom\"><strong>অভিধানে নেই, পরীক্ষায় আছে · কিছু কাজের Idiom<\/strong><\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th><strong>Idiom<\/strong><\/th>\n<th><strong>অর্থ<\/strong><\/th>\n<th><strong>উদাহরণ<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>a piece of cake<\/td>\n<td>খুব সহজ<\/td>\n<td>The exam was a piece of cake.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>once in a blue moon<\/td>\n<td>কদাচিৎ<\/td>\n<td>I eat fast food once in a blue moon.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>under the weather<\/td>\n<td>শরীর খারাপ<\/td>\n<td>I felt under the weather today.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>hit the books<\/td>\n<td>মন দিয়ে পড়তে বসা<\/td>\n<td>I must hit the books tonight.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>on the same page<\/td>\n<td>একমত থাকা<\/td>\n<td>We are on the same page.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>break the ice<\/td>\n<td>আড়ষ্টতা কাটানো<\/td>\n<td>A joke broke the ice.<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>burn the midnight oil<\/td>\n<td>রাত জেগে কাজ করা<\/td>\n<td>He burned the midnight oil before exams.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>get the ball rolling<\/td>\n<td>কাজ শুরু করা<\/td>\n<td>Let's get the ball rolling.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>পরামর্শ: Idiom একটি-দুটির বেশি ব্যবহার করবেন না। প্রাকৃতিকভাবে এলে ভালো, জোর করে ঢোকালে খারাপ শোনায়।<\/p>\n<h3 id=\"বাংলাভাষীদের-সাধারণ-উচ্চারণ-সমস্যা\"><strong>বাংলাভাষীদের সাধারণ উচ্চারণ সমস্যা<\/strong><\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th><strong>সমস্যা<\/strong><\/th>\n<th><strong>উদাহরণ<\/strong><\/th>\n<th><strong>সমাধান<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>th (θ / ð)<\/td>\n<td>think, three, this<\/td>\n<td>জিভের ডগা সামনের দাঁতের হালকা স্পর্শে রেখে বাতাস ছাড়ুন; \"থ\"/\"দ\" বলবেন না<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>v ও w<\/td>\n<td>very / wary, vine / wine<\/td>\n<td>v-এ নিচের ঠোঁট ওপরের দাঁতে; w-এ ঠোঁট গোল করুন<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>শব্দের শেষের ধ্বনি<\/td>\n<td>worked, helped, asked<\/td>\n<td>শেষের /t/ ধ্বনি বাদ দেবেন না<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Stress<\/td>\n<td>PHOtograph / phoTOgrapher<\/td>\n<td>অভিধানে stress চিহ্ন দেখে শব্দটি জোরে বলে অভ্যাস করুন<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Intonation<\/td>\n<td>প্রশ্নে সুর ওঠে, তথ্যে নামে<\/td>\n<td>ব্রিটিশ/আমেরিকান উচ্চারণ শুনে অনুকরণ (shadowing) করুন<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n"}, {"part": "Part C", "title": "Listening ও Reading · প্রশ্ন অনুযায়ী কৌশল", "id": "p54", "kind": "doc", "html": "<h3 id=\"listening\"><strong>Listening<\/strong><\/h3>\n<div class=\"callout\"><strong>পরিস্থিতি<\/strong><\/th>\n<th><strong>কী করবেন<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>শুরুর আগে<\/td>\n<td>প্রস্তুতির ৩০ সেকেন্ডে প্রশ্ন পড়ে কিওয়ার্ড (নাম, সংখ্যা, স্থান) দাগ দিন এবং কী ধরনের শব্দ আসবে অনুমান করুন।<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Form/Note completion<\/td>\n<td>শব্দসীমা দেখুন (ONE WORD / NO MORE THAN TWO)। বানান ঠিক রাখুন, নইলে নম্বর কাটা যায়।<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Multiple choice<\/td>\n<td>বক্তা প্রথমে ভুল তথ্য বলে পরে শুধরে নিতে পারেন। শেষ কথাটিই ধরুন।<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Map/Diagram<\/td>\n<td>দিকনির্দেশক শব্দ চিনুন: opposite, next to, behind, to the left of।<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>অডিও চলার সময়<\/td>\n<td>একটি উত্তরে আটকে গেলে সঙ্গে সঙ্গে ছেড়ে এগিয়ে যান।<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>শেষে<\/td>\n<td>১০ মিনিটে প্রতিটি উত্তর কপি করুন; বানান, বহুবচন (-s), বড় হাতের অক্ষর দেখুন।<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"reading\"><strong>Reading<\/strong><\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th><strong>প্রশ্নের ধরন<\/strong><\/th>\n<th><strong>কৌশল<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>প্যাসেজ শুরুর আগে<\/td>\n<td>পুরো পড়বেন না। শিরোনাম, প্রথম ও শেষ অনুচ্ছেদ এবং প্রতি অনুচ্ছেদের প্রথম বাক্য দেখে (Skimming) বিষয় বুঝে নিন।<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>True / False / Not Given<\/td>\n<td>True = প্যাসেজের সঙ্গে মেলে; False = প্যাসেজের উল্টো; <strong>Not Given = প্যাসেজে কিছুই বলা নেই<\/strong>। নিজের জ্ঞান ব্যবহার করবেন না।<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Matching Headings<\/td>\n<td>প্রথমে অনুচ্ছেদের মূল ভাব বের করুন, তারপর শিরোনাম খুঁজুন। একটি শব্দ মিলে গেলেই উত্তর ধরে নেবেন না।<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Sentence/Summary completion<\/td>\n<td>শব্দসীমা মানুন, ব্যাকরণ বসে কি না মিলিয়ে দেখুন।<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Multiple choice<\/td>\n<td>ভুল বিকল্প বাদ দিন (Elimination); প্যাসেজের শব্দ হুবহু থাকা বিকল্প প্রায়ই ফাঁদ।<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>সময় ব্যবস্থাপনা<\/td>\n<td>প্রতি প্যাসেজে ২০ মিনিট। কঠিন প্রশ্নে ২ মিনিটের বেশি নয়, পরে ফিরে আসুন।<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Paraphrase চেনা<\/td>\n<td>প্রশ্ন ও প্যাসেজের শব্দ ভিন্ন হয়। যেমন: rise = increase, buy = purchase, problem = difficulty। এ জন্যই এই বইয়ের সমার্থক শব্দ জানা জরুরি।<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th><strong>অভ্যাস করার সহজ নিয়ম<\/strong> সপ্তাহে ২টি সম্পূর্ণ Mock Test (Cambridge IELTS) সময় ধরে সমাধান করুন। ভুল প্রশ্নগুলো একটি খাতায় লিখুন এবং কেন ভুল হলো তা এক লাইনে লিখুন। প্রতিদিন BBC বা TED-এর ৫ মিনিট শুনুন, তারপর যা শুনেছেন তা লিখে ফেলুন (Dictation)।<\/div>\n"}, {"part": "Part C", "title": "Grammar · বাঙালি শিক্ষার্থীদের ২৫টি সাধারণ ভুল", "id": "p55", "kind": "doc", "html": "<p>ভুলগুলোর বেশির ভাগই আসে বাংলা বাক্য সরাসরি ইংরেজিতে অনুবাদ করার চেষ্টা থেকে। প্রতিটি ভুলের পাশে কারণটা পড়ুন, তাহলে আর পুনরাবৃত্তি হবে না।<\/p>\n<div class=\"callout\"><strong>ভুল<\/strong><\/th>\n<th><strong>ঠিক<\/strong><\/th>\n<th><strong>কারণ<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>I am agree with this.<\/td>\n<td>I <strong>agree<\/strong> with this.<\/td>\n<td>agree নিজেই verb; am লাগে না<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>He is knowing the answer.<\/td>\n<td>He <strong>knows<\/strong> the answer.<\/td>\n<td>know ক্রিয়ায় continuous হয় না<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>I am living here since 2015.<\/td>\n<td>I <strong>have lived<\/strong> here since 2015.<\/td>\n<td>since/for-এর সঙ্গে Present Perfect<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>She don't like tea.<\/td>\n<td>She <strong>doesn't<\/strong> like tea.<\/td>\n<td>He/She/It-এর সঙ্গে does<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>There is many people.<\/td>\n<td>There <strong>are<\/strong> many people.<\/td>\n<td>many মানে বহুবচন<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>Information are important.<\/td>\n<td>Information <strong>is<\/strong> important.<\/td>\n<td>information uncountable<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>She gave me many advices.<\/td>\n<td>She gave me a lot of <strong>advice<\/strong>.<\/td>\n<td>advice uncountable; advices হয় না<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>I have a good news.<\/td>\n<td>I have <strong>good news<\/strong>.<\/td>\n<td>news uncountable<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>He discussed about the topic.<\/td>\n<td>He <strong>discussed<\/strong> the topic.<\/td>\n<td>discuss-এর পর about লাগে না<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>We reached to the station.<\/td>\n<td>We <strong>reached<\/strong> the station.<\/td>\n<td>reach-এর পর to লাগে না<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>I am interested on music.<\/td>\n<td>I am interested <strong>in<\/strong> music.<\/td>\n<td>interested in<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>He is good in English.<\/td>\n<td>He is good <strong>at<\/strong> English.<\/td>\n<td>good at<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>She is afraid from dogs.<\/td>\n<td>She is afraid <strong>of<\/strong> dogs.<\/td>\n<td>afraid of<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>I depend of my parents.<\/td>\n<td>I depend <strong>on<\/strong> my parents.<\/td>\n<td>depend on<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>It is depend on you.<\/td>\n<td>It <strong>depends<\/strong> on you.<\/td>\n<td>depend verb; is লাগে না<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>The people is happy.<\/td>\n<td>The people <strong>are<\/strong> happy.<\/td>\n<td>people বহুবচন<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>He is more taller than me.<\/td>\n<td>He is <strong>taller<\/strong> than me.<\/td>\n<td>more ও -er একসাথে নয়<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>I have much friends.<\/td>\n<td>I have <strong>many<\/strong> friends.<\/td>\n<td>গণনাযোগ্য শব্দে many<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Every students must come.<\/td>\n<td><strong>Every student<\/strong> must come.<\/td>\n<td>every + একবচন<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>I did not went there.<\/td>\n<td>I did not <strong>go<\/strong> there.<\/td>\n<td>did not-এর পর verb-এর মূল রূপ<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Though he is rich, but he is unhappy.<\/td>\n<td>Though he is rich, he is unhappy.<\/td>\n<td>Though ও but একসাথে নয়<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>I want that you help me.<\/td>\n<td>I want <strong>you to help<\/strong> me.<\/td>\n<td>want + object + to + verb<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>My brother is a engineer.<\/td>\n<td>My brother is <strong>an<\/strong> engineer.<\/td>\n<td>স্বরধ্বনির আগে an<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>I went to the school yesterday.<\/td>\n<td>I went to school yesterday.<\/td>\n<td>প্রতিষ্ঠানের মূল কাজ বোঝালে the লাগে না<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>Open the window, please, it is hot.<\/td>\n<td>It is hot, so please open the window.<\/td>\n<td>কমা দিয়ে দুটি বাক্য জোড়া নয় (comma splice)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"article-a--an--the--তিনটি-সূত্র\"><strong>Article (a / an / the) · তিনটি সূত্র<\/strong><\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th><strong>সূত্র<\/strong><\/th>\n<th><strong>ব্যাখ্যা<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>a / an<\/td>\n<td>প্রথমবার উল্লেখ বা সাধারণ একটি জিনিস: I saw <strong>a<\/strong> dog.<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>the<\/td>\n<td>নির্দিষ্ট বা আগে উল্লেখিত: <strong>The<\/strong> dog was brown. একমাত্র জিনিস: <strong>the<\/strong> sun।<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>কিছুই নয়<\/td>\n<td>সাধারণ বহুবচন ও uncountable: <strong>Dogs<\/strong> are loyal. <strong>Water<\/strong> is essential.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"preposition--জোড়া-যা-মুখস্থ-রাখতে-হয়\"><strong>Preposition · জোড়া যা মুখস্থ রাখতে হয়<\/strong><\/h3>\n<div class=\"tw\"><table>\n<thead>\n<tr class=\"header\">\n<th><strong>responsible for<\/strong><\/th>\n<th><strong>result in<\/strong><\/th>\n<th><strong>rely on<\/strong><\/th>\n<th><strong>suffer from<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr class=\"odd\">\n<td>contribute to<\/td>\n<td>focus on<\/td>\n<td>lead to<\/td>\n<td>benefit from<\/td>\n<\/tr>\n<tr class=\"even\">\n<td>pay attention to<\/td>\n<td>consist of<\/td>\n<td>accuse of<\/td>\n<td>participate in<\/td>\n<\/tr>\n<tr class=\"odd\">\n<td>prevent from<\/td>\n<td>be aware of<\/td>\n<td>differ from<\/td>\n<td>be famous for<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"spelling-trap--৪০টি-শব্দ-যেখানে- let tm=null;function pad(){C.innerHTML=`<h1>✍️ Writing Pad</h1><div class="ctl"><button id="t1">Task 1 · ২০ মি.</button><button id="t2">Task 2 · ৪০ মি.</button><button id="ts">থামান</button><b id="tc" style="padding:6px 12px">--:--</b><span id="wc" style="margin-left:auto;color:var(--mu)"></span></div><textarea id="ta" placeholder="এখানে লিখুন… (স্বয়ংক্রিয়ভাবে সেভ হয়) Task 1: ১৫০+ শব্দ, Task 2: ২৫০+ শব্দ" spellcheck="true">${esc(S.w)}</textarea><div class="ctl"><button id="tcl">মুছুন</button></div>`;
 const ta=$('#ta'),cnt=()=>{const n=(ta.value.trim().match(/\S+/g)||[]).length;$('#wc').textContent=n+' শব্দ';S.w=ta.value;sv()};ta.oninput=cnt;cnt();
 const run=m=>{clearInterval(tm);let s=m*60;const f=()=>{$('#tc').textContent=String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');if(s--<=0){clearInterval(tm);$('#tc').textContent='⏰ সময় শেষ'}};f();tm=setInterval(f,1000)};
 $('#t1').onclick=()=>run(20);$('#t2').onclick=()=>run(40);$('#ts').onclick=()=>{clearInterval(tm);$('#tc').textContent='--:--'};$('#tcl').onclick=()=>{if(confirm('সব লেখা মুছবেন?')){ta.value='';cnt()}}}

const q=$('#q'),res=$('#res');q.oninput=()=>{const v=q.value.trim().toLowerCase();if(!v){res.style.display='none';return}
 const r=W.filter(w=>w.w.toLowerCase().includes(v)||w.m.includes(v)).slice(0,12);
 res.innerHTML=r.map((w,i)=>`<div data-i="${i}"><b>${esc(w.w)}</b> — ${esc(w.m)} <small style="color:var(--mu)">${esc(PM[w.g].title.split(' · ')[0])}</small></div>`).join('')||'<div>কিছু পাওয়া যায়নি</div>';res.style.display='block';
 res.onclick=e=>{const d=e.target.closest('[data-i]');if(!d)return;const w=r[d.dataset.i];HL=w.w;res.style.display='none';q.value='';if(location.hash=='#/p/'+w.g)route();else location.hash='#/p/'+w.g}};
document.addEventListener('click',e=>{if(!e.target.closest('#res,#q'))res.style.display='none'});
window.addEventListener('hashchange',route);route();
</script></body></html>
